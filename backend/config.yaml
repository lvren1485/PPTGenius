# PPTGenius 业务配置
# 所有字段及可选值见 models.py 中各 Config 类的默认值与类型

workspace:
  root: "./data/workspace"
  input_dir: "input"
  output_dir: "output"
  knowledge_dir: "knowledge"

rag:
  top_k: 5                            # BM25 检索返回条数

agent:
  outline:
    generator_max_retries: 3          # 大纲生成单 section 失败最大重试次数
  cache:
    trim_max_tokens: 900000           # 上下文超出时裁剪阈值
    enable_node_cache: true           # 启用 LangGraph 节点缓存
    summarize_threshold: 0.7          # context_usage > 此值触发对话历史摘要

llm:
  provider: "deepseek"                # 仅支持: deepseek
  base_url: "https://api.deepseek.com/v1"
  api_key: "your_deepseek_api_key"
  model: "deepseek-v4-flash"
  temperature: 0.7                    # 0.0 ~ 2.0
  max_tokens: 80000

db:
  type: "mysql"               # 仅支持: mysql
  host: "localhost"
  port: 3306
  username: "root"
  password: ""                 # 在 config.local.yaml 中填写真实密码
  database: "pptgenius"

log:
  level: "INFO"                       # 仅支持: DEBUG | INFO | WARNING | ERROR | CRITICAL
  file_enabled: true
  file_path: "logs/app.log"
  file_max_bytes: 10485760            # 10 MB
  file_backup_count: 5

web_search:
  enabled: true
  engine: "duckduckgo"                # 仅支持: duckduckgo | searxng
  max_results: 5
  timeout: 15                          # 单次搜索/抓取超时秒数
  searxng_base_url: ""                # engine=searxng 时必须填写，如 http://localhost:8080
