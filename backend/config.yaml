# PPTGenius 业务配置
app:
  name: "PPTGenius"
  version: "0.1.0"

workspace:
  root: "./data/workspace"
  input_dir: "input"
  output_dir: "output"
  knowledge_dir: "knowledge"
  logs_dir: "logs"

rag:
  algorithm: "bm25"
  top_k: 5
  supported_formats: [".txt", ".pdf", ".docx", ".csv", ".xlsx"]

agent:
  outline:
    mode: "mix"               # max_iteration | pass_score | mix
    max_iterations: 5
    pass_score: 9.0           # 0-10, used by pass_score / mix modes
    evaluation_threshold: 0.7
  ppt:
    mode: "sub_agent"          # sub_agent | freedom
    max_retries_per_slide: 3
    slide_timeout_seconds: 120
  cache:
    trim_max_tokens: 500000
    enable_node_cache: true

llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"
  api_key: "your_deepseek_api_key"
  model: "deepseek-v4-flash"
  temperature: 0.7
  max_tokens: 50000

db:
  type: "mysql"
  url: "mysql+asyncmy://{username}:{password}@localhost:3306/pptgenius"

log:
  level: "INFO"
  file_enabled: true
  file_path: "logs/app.log"
  file_max_bytes: 10485760   # 10 MB
  file_backup_count: 5

web_search:
  enabled: true
  engine: "duckduckgo"
  max_results: 5
  timeout: 15
  bing_api_key: ""
  google_api_key: ""
  google_cx: ""
  tavily_api_key: ""
  searxng_base_url: ""
