# PPTGenius 业务配置
app:
  name: "PPTGenius"
  version: "0.1.0"

workspace:
  root: "./data/workspace"
  input_dir: "input"
  output_dir: "output"
  knowledge_dir: "knowledge"
  logs_dir: "logs"

rag:
  algorithm: "bm25"
  top_k: 5
  bm25_index_file: "bm25_index.pkl"
  supported_formats: [".txt", ".pdf", ".docx", ".csv", ".xlsx"]

agent:
  outline:
    max_iterations: 5
    evaluation_threshold: 0.7
  cache:
    trim_max_tokens: 8000
    enable_node_cache: true

llm:
  provider: "deepseek"
  temperature: 0.7
  max_tokens: 4096

db:
  type: "sqlite"
  sqlite_path: "./data/db/pptgenius.db"
