# PPTGenius 业务配置

workspace:
  root: "./data/workspace"
  input_dir: "input"
  output_dir: "output"
  knowledge_dir: "knowledge"

rag:
  top_k: 5

agent:
  outline:
    generator_max_retries: 3
  cache:
    trim_max_tokens: 900000
    enable_node_cache: true
    summarize_threshold: 0.7

llm:
  provider: "deepseek"
  base_url: "https://api.deepseek.com/v1"
  api_key: "your_deepseek_api_key"
  model: "deepseek-v4-flash"
  temperature: 0.7
  max_tokens: 80000

db:
  url: "mysql+asyncmy://{username}:{password}@localhost:3306/pptgenius"

log:
  level: "INFO"
  file_enabled: true
  file_path: "logs/app.log"
  file_max_bytes: 10485760   # 10 MB
  file_backup_count: 5

web_search:
  enabled: true
  engine: "duckduckgo"
  max_results: 5
  timeout: 5
  searxng_base_url: ""
