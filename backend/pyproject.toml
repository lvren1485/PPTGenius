[project]
name = "pptgenius"
version = "0.1.0"
description = "单人 AI PPT 生成网站 — BM25 检索 + LangGraph Agent + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langgraph>=1.0",
    "langchain-openai>=0.3",
    "langchain>=1.3.4",
    "rank-bm25>=0.2",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-multipart>=0.0.20",
    "tiktoken>=0.8",
    "pymupdf>=1.27.2.3",
    "resvg-py>=0.3.2",
    "jieba>=0.42.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "matplotlib>=3.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/pptgenius"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
